<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stockroom</title>
  <meta name="description" content="Stockroom: multi-warehouse inventory and purchasing for an electronics and hardware distributor. A static demo with an event-sourced stock ledger, role-based approvals and an audit log.">
  <meta name="theme-color" content="#1C1C1A">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23F2C230'/%3E%3Cpath d='M7 25V12l9-5 9 5v13' fill='none' stroke='%231C1C1A' stroke-width='3'/%3E%3Cpath d='M11 25v-8h10v8M11 21h10' fill='none' stroke='%231C1C1A' stroke-width='2.4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <a class="brand" href="#/overview" aria-label="Stockroom overview">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="4" fill="#F2C230"/><path d="M7 25V12l9-5 9 5v13" fill="none" stroke="#1C1C1A" stroke-width="3"/><path d="M11 25v-8h10v8M11 21h10" fill="none" stroke="#1C1C1A" stroke-width="2.4"/></svg>
        <span class="brand-name">Stockroom<span class="brand-org">Qasim Electronics Distribution</span></span>
      </a>
      <nav class="nav" id="side-nav" aria-label="Main navigation"></nav>
      <div class="sidebar-foot">
        <div class="wh-list" aria-label="Warehouses">
          <span class="eyebrow">Warehouses</span>
          <span><span class="mono">KHI</span> Karachi</span>
          <span><span class="mono">LHE</span> Lahore</span>
          <span><span class="mono">DXB</span> Dubai</span>
        </div>
        <p>Demo data is stored in your browser.</p>
        <button type="button" class="linklike" data-action="reset-demo">Reset demo data</button>
      </div>
    </aside>
    <div class="main-col">
      <header class="topbar">
        <button type="button" class="btn btn-ghost btn-icon nav-toggle" id="nav-toggle" aria-controls="mobile-nav" aria-expanded="false" aria-label="Open menu">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <a class="brand brand-top" href="#/overview" aria-label="Stockroom overview">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="4" fill="#F2C230"/><path d="M7 25V12l9-5 9 5v13" fill="none" stroke="#1C1C1A" stroke-width="3"/><path d="M11 25v-8h10v8M11 21h10" fill="none" stroke="#1C1C1A" stroke-width="2.4"/></svg>
          <span class="brand-name">Stockroom</span>
        </a>
        <div class="topbar-date" id="topbar-date"></div>
        <div class="topbar-spacer"></div>
        <div class="user-switch">
          <label for="user-select">Signed in as</label>
          <span class="avatar" id="user-avatar" aria-hidden="true"></span>
          <select id="user-select" class="input"></select>
        </div>
      </header>
      <nav class="mobile-nav" id="mobile-nav" aria-label="Main navigation" hidden></nav>
      <main id="main" tabindex="-1"></main>
      <footer class="demo-note">Demo data is stored in your browser. <button type="button" class="linklike" data-action="reset-demo">Reset demo data</button></footer>
    </div>
  </div>
  <div class="toast-stack" id="toast-stack" aria-hidden="true"></div>
  <div class="sr-only" id="toasts" role="status" aria-live="polite"></div>
  <div class="sr-only" id="toasts-alert" role="alert" aria-live="assertive"></div>
  <noscript><p style="padding:24px">Stockroom needs JavaScript to run.</p></noscript>
</body>
</html>
